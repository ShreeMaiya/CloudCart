name: Provision & Deploy CloudCart to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Provision Cloudflare Resources & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OBSERVABILITY_API_KEY: ${{ secrets.OBSERVABILITY_API_KEY }}
      CF_OBSERVABILITY_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Provision Cloudflare Resources & Deploy
        run: node scripts/setup.js
